            properties:
                username:
                    type: string
                    example: admin
                password:
                    type: string
                    example: admin123
        LoginResponse:
            type: object
            properties:
                success:
                    type: boolean
                token:
                    type: string
                role:
                    type: string
                username:
                    type: string
                permissions:
                    type: array
                    items:
                        type: string
